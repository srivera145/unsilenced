# The one site in the Docker image. Replaces the image's 000-default.conf so
# its access log is the private format (docker/apache/unsilenced-privacy.conf)
# rather than "combined". ${APACHE_DOCUMENT_ROOT} and ${APACHE_LOG_DIR} come
# from the environment; in the official php image both logs go to the
# container's stdout and stderr.
<VirtualHost *:80>
    DocumentRoot ${APACHE_DOCUMENT_ROOT}

    # AllowOverride All: public_html/.htaccess routes every request through
    # index.php. The image's own <Directory /var/www/> says None.
    <Directory ${APACHE_DOCUMENT_ROOT}>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log unsilenced_private
</VirtualHost>
