# Unsilenced: Apache's logs record nothing that identifies a visitor.
# Installed as /etc/apache2/conf-available/unsilenced-privacy.conf by the
# Dockerfile. docs/DEPLOY-PRIVACY.md has the same settings for other servers.
#
# Access log: time, method, path, protocol, status, bytes and duration.
#   No client IP (%h, %a), no identd or auth user (%l, %u), no Referer, no
#   User-Agent. %U is the path WITHOUT the query string: /auth/magic carries a
#   sign-in token and an email address, and /schools?q= carries what someone
#   searched for.
LogFormat "%t \"%m %U %H\" %>s %b %D" unsilenced_private

# The image's stock nicknames get the same format, so a CustomLog anywhere else
# (the default site, other-vhosts-access-log, one added later) cannot bring the
# address back by naming "combined".
LogFormat "%t \"%m %U %H\" %>s %b %D" combined
LogFormat "%t \"%m %U %H\" %>s %b %D" common
LogFormat "%t \"%m %U %H\" %>s %b %D" vhost_combined
LogFormat "%t \"%m %U %H\" %>s %b %D" referer
LogFormat "%t \"%m %U %H\" %>s %b %D" agent

# Error log: kept, without the client. Apache's default error format prefixes
# request errors with "[client IP:port]" and appends ", referer: ...". This
# format has neither: time, module and level, process, source, status, message.
ErrorLogFormat "[%{u}t] [%-m:%l] [pid %P] %F: %E: %M"

# Debian's Apache enables mod_status for local requests, and with extended
# status (on by default once mod_status loads) /server-status lists the client
# address of every request in progress. Off keeps addresses off that page.
<IfModule mod_status.c>
    ExtendedStatus Off
</IfModule>
